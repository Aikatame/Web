<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAT Electrical</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#030814;
overflow:hidden;
height:100vh;
color:white;
position:relative;
}

/* Grid Background */

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background-image:
linear-gradient(rgba(0,180,255,.08) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,180,255,.08) 1px, transparent 1px);
background-size:60px 60px;
z-index:-2;
}

/* Navbar */

header{
position:absolute;
top:0;
left:0;
width:100%;
padding:30px 70px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:100;
}

.logo{
font-size:18px;
font-weight:600;
color:#00cfff;
letter-spacing:2px;
}

nav{
display:flex;
gap:40px;
}

nav a{
text-decoration:none;
color:#9ab7d3;
text-transform:uppercase;
font-size:13px;
letter-spacing:3px;
}

.call-btn{
padding:12px 25px;
background:transparent;
border:1px solid #ffd000;
color:#ffd000;
cursor:pointer;
transition:.3s;
}

.call-btn:hover{
background:#ffd000;
color:black;
}

/* Hero */

.hero{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:100%;
}

.top-text{
color:#00cfff;
letter-spacing:8px;
font-size:14px;
margin-bottom:30px;
}

.hero h1{
font-size:8rem;
font-weight:900;
line-height:0.9;
text-transform:uppercase;
}

.hero h1 span{
display:block;
}

.bottom-text{
margin-top:25px;
letter-spacing:8px;
font-size:13px;
color:#9ab7d3;
}

/* Orbit Rings */

.orbit{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
border-radius:50%;
}

.ring1{
width:500px;
height:250px;
border:12px solid rgba(0,200,255,.4);
animation:spin 15s linear infinite;
}

.ring2{
width:650px;
height:650px;
border:8px solid rgba(255,208,0,.18);
animation:spinReverse 20s linear infinite;
}

.ring3{
width:100px;
height:700px;
border:2px solid rgba(255,255,255,.4);
animation:spin 12s linear infinite;
}

@keyframes spin{
from{
transform:translate(-50%,-50%) rotate(0deg);
}
to{
transform:translate(-50%,-50%) rotate(360deg);
}
}

@keyframes spinReverse{
from{
transform:translate(-50%,-50%) rotate(360deg);
}
to{
transform:translate(-50%,-50%) rotate(0deg);
}
}

/* Stars */

.star{
position:absolute;
background:#00cfff;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
50%{
opacity:.3;
}
}

/* Scroll */

.scroll{
position:absolute;
right:40px;
bottom:120px;
writing-mode:vertical-rl;
letter-spacing:4px;
color:#7ca5c9;
font-size:12px;
}

/* Responsive */

@media(max-width:768px){

.hero h1{
font-size:4rem;
}

nav{
display:none;
}

header{
padding:20px;
}

}

</style>
</head>
<body>

<header>

<div class="logo">
⚡ PAT ELECTRICAL
</div>

<nav>
<a href="#">Services</a>
<a href="#">About</a>
<a href="#">Projects</a>
<a href="#">Contact</a>
</nav>

<button class="call-btn">
CALL NOW
</button>

</header>

<div class="orbit ring1"></div>
<div class="orbit ring2"></div>
<div class="orbit ring3"></div>

<section class="hero">

<d

<div class="top-text">
LICENSED | INSURED | 24/7 EMERGENCY
</div>

<h1>
<span>PAT</span>
<span>ELECTRICAL</span>
</h1>

<div class="bottom-text">
SERVICE | EXPERT | ENGINEER
</div>

</section>

<script>

// Particle Generator

for(let i=0;i<80;i++){

let star=document.createElement("div");
star.classList.add("star");

let size=Math.random()*4+1;

star.style.width=size+"px";
star.style.height=size+"px";

star.style.left=Math.random()*100+"vw";
star.style.top=Math.random()*100+"vh";

star.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(star);

}

</script>

<script>
document.addEventListener("mousemove", function(e) {
    const spark = document.createElement("div");
    spark.classList.add("lightning");

    spark.style.left = e.clientX + "px";
    spark.style.top = e.clientY + "px";

    document.body.appendChild(spark);

    setTimeout(() => {
        spark.remove();
    }, 600);
});
</script>

</body>
</html>
